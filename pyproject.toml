[project]
name = "discord-live"
version = "0.1.0"
description = "Cria um Google Meet automaticamente quando alguém entra num canal de voz do Discord"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["discord-py (>=2.7.1,<3.0.0)", "google-apps-meet (>=0.5.1,<0.6.0)", "google-auth (>=2.58.1,<3.0.0)", "google-auth-oauthlib (>=1.4.1,<2.0.0)", "python-dotenv (>=1.2.3,<2.0.0)"]

[project.scripts]
discord-live = "discord_live.bot:main"

[tool.poetry]
packages = [{ include = "discord_live", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
